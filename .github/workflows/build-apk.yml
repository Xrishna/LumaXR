name: Build LumaXR ARM64 APK & Publish Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.1 platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compute Dynamic Package Name & Build Version
        id: build_meta
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          RUN_NUM=${{ github.run_number }}
          APP_ID="com.lumaxr.player.b${RUN_NUM}.r${SHORT_SHA}"
          VERSION_CODE=$((100 + RUN_NUM))
          VERSION_NAME="1.0.${RUN_NUM}-${SHORT_SHA}"
          TAG_NAME="v${VERSION_NAME}"
          echo "app_id=${APP_ID}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Dynamic applicationId: ${APP_ID}"

      - name: Prepare Release Signing Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/lumaxr-release.jks
          else
            keytool -genkeypair -v \
              -keystore /tmp/lumaxr-release.jks \
              -alias lumaxr \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass lumaxr_ci -keypass lumaxr_ci \
              -dname "CN=LumaXR CI, OU=Media, O=LumaXR, L=IN, C=IN"
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build ARM64 Release APK
        env:
          LUMAXR_APP_ID: ${{ steps.build_meta.outputs.app_id }}
          LUMAXR_VERSION_CODE: ${{ steps.build_meta.outputs.version_code }}
          LUMAXR_VERSION_NAME: ${{ steps.build_meta.outputs.version_name }}
          LUMAXR_KEYSTORE_PATH: /tmp/lumaxr-release.jks
          LUMAXR_KEYSTORE_PASSWORD: lumaxr_ci
          LUMAXR_KEY_ALIAS: lumaxr
          LUMAXR_KEY_PASSWORD: lumaxr_ci
        run: |
          gradle assembleRelease \
            -PappId="${LUMAXR_APP_ID}" \
            -PversionCode="${LUMAXR_VERSION_CODE}" \
            -PversionName="${LUMAXR_VERSION_NAME}" \
            --stacktrace

      - name: Verify 16 KB ELF Page Alignment & APK ZipAlign
        id: verify_16k
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT
          test -f "${APK_PATH}"

          ZIPALIGN=$(find "${ANDROID_HOME}/build-tools" -name "zipalign" | sort -V | tail -n 1)
          echo "Checking 16KB ZIP alignment with ${ZIPALIGN}..."
          "${ZIPALIGN}" -c -P 16 -v 4 "${APK_PATH}" | tail -n 15

          mkdir -p /tmp/apk_unzip
          unzip -q -o "${APK_PATH}" "lib/arm64-v8a/*.so" -d /tmp/apk_unzip || true

          FAILED=0
          REPORT=""
          for sofile in /tmp/apk_unzip/lib/arm64-v8a/*.so; do
            [ -e "$sofile" ] || continue
            ALIGN_HEX=$(readelf -l "$sofile" | awk '/LOAD/ {getline; print $NF}' | sort -u | tr '\n' ' ')
            echo "$(basename "$sofile") -> LOAD Align: ${ALIGN_HEX}"
            if readelf -l "$sofile" | grep -A1 "LOAD" | grep -Eq "0x1000$|0x2000$"; then
              echo "ERROR: $(basename "$sofile") is NOT 16 KB (0x4000) aligned!"
              FAILED=1
            fi
            REPORT="${REPORT}\n- \`$(basename "$sofile")\`: LOAD Align \`${ALIGN_HEX}\`"
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          RENAMED_APK="LumaXR-${{ steps.build_meta.outputs.version_name }}-arm64-v8a.apk"
          cp "${APK_PATH}" "${RENAMED_APK}"
          SHA256=$(sha256sum "${RENAMED_APK}" | awk '{print $1}')
          echo "renamed_apk=${RENAMED_APK}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT

      - name: Generate Categorized Release Notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE_ARG=""
          if [ -n "$PREV_TAG" ]; then
            RANGE_ARG="${PREV_TAG}..HEAD"
          fi
          COMMITS=$(git log $RANGE_ARG --pretty=format:"- %s (%h)" -n 30)

          {
            echo "## LumaXR \`${{ steps.build_meta.outputs.version_name }}\` (ARM64-v8a)"
            echo ""
            echo "- **Dynamic Package Name (\`applicationId\`):** \`${{ steps.build_meta.outputs.app_id }}\`"
            echo "- **Target Hardware:** Xiaomi Redmi Pad Pro 5G (\`24074RPD2I\` / \`ruan_in\`), Android 16 (API 36), Adreno 710"
            echo "- **16 KB Page-Size Verification:** All \`lib/arm64-v8a/*.so\` ELF \`LOAD\` segments verified \`>= 0x4000\` + \`zipalign -P 16\` passed"
            echo "- **APK SHA-256:** \`${{ steps.verify_16k.outputs.sha256 }}\`"
            echo ""
            echo "### Release Summary"
            echo ""
            echo "#### Added"
            echo "- Dual-engine HDR/Dolby Vision video core (\`libmpv + libplacebo\` \`vo=gpu-next\` + Hard-Gated \`Media3 1.11.1\` Dolby HAL)"
            echo "- Sony BRAVIA XR physics-synchronized IPS backlight spline (\`RuanBacklightSpline\` & \`RuanBacklightController\`) + \`xr_lcd_master.glsl\`"
            echo "- Audiophile Hi-Res & Dolby Music Player (\`MediaLibraryService\`, USB-C Bit-Perfect \`AudioMixerAttributes\`, \`LoudnessCodecController\`, \`Spatializer\`, 15-band \`DynamicsProcessing\` + AutoEQ)"
            echo "- Native 120 Hz Kawarp \`GL_RGBA16F\` Visualizer Studio + Apple Music Word-by-Word \`AmLyricsView\` (TTML / ELRC / YRC / QRC / LRCLIB)"
            echo "- SMB v2/v3, WebDAV, Jellyfin/Emby/Plex streaming with \`RangeChunkCache\`, Chapter/Intro Skipper, Auto-PiP 2.0, Last.fm/ListenBrainz scrobbling"
            echo ""
            echo "#### Changed"
            echo "- Rotated APK \`applicationId\` to \`${{ steps.build_meta.outputs.app_id }}\` for side-by-side CI testing"
            echo "- Enforced uncompressed \`jniLibs\` packaging and 16 KB page-size verification gate"
            echo ""
            echo "#### Fixed"
            echo "- Mitigated HyperOS \`ruan\` \`desiredRatio(10.00)\` milky-black HWC quirk via hard-gated SDR/sRGB calibration & \`target-contrast=1200\`"
            echo "- Prevented Navigation 3 Predictive Back \`ApproachLayout\` glitches via two-phase \`sharedElementWithCallerManagedVisibility\`"
            echo ""
            echo "#### Enhancements & Upgrades"
            echo "- Upgraded \`AudioFftAnalyzer\`, \`ThermalGovernor\` (API 36 \`getGpuHeadroom\`), and \`LumaHaptics\` (API 36 \`WaveformEnvelopeBuilder\`)"
            echo "- Added 1-tap JSON/ZIP \`ConfigBackupManager\` so tuning survives dynamic package ID updates"
            echo ""
            echo "#### Commits Included"
            echo "${COMMITS}"
          } > release_notes.md

      - name: Upload ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.verify_16k.outputs.renamed_apk }}
          path: ${{ steps.verify_16k.outputs.renamed_apk }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build_meta.outputs.tag_name }}
          name: "LumaXR ${{ steps.build_meta.outputs.version_name }} (arm64-v8a)"
          body_path: release_notes.md
          files: ${{ steps.verify_16k.outputs.renamed_apk }}
          fail_on_unmatched_files: true
